<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="めいろロボ">
<meta name="theme-color" content="#fff7ed">
<title>めいろロボ</title>
<style>
  :root {
    --bg: #fff7ed; --card: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --orange: #f97316; --teal: #0d9488; --pencil: #c4c7cc; --wall: #4a4f5c; --path: #f97316;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.on { display: flex; }
  .big { border-radius: 22px; padding: 18px 28px; font-size: 26px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .b-orange { background: var(--orange); color: #fff; } .b-teal { background: var(--teal); color: #fff; } .b-white { background: #fff; border: 2px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .bar h2 { margin: 0; font-size: 22px; flex: 1; text-align: center; }
  .icon { width: 54px; height: 54px; border-radius: 16px; background: #fff; border: 2px solid var(--line); font-size: 26px; display: grid; place-items: center; }
  /* ホーム */
  #home { align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #home h1 { font-size: 54px; margin: 0; letter-spacing: 2px; }
  #home h1 span { color: var(--orange); }
  #home .sub { color: var(--muted); font-size: 20px; margin: 0 0 8px; }
  #homeRobot { width: 200px; height: 200px; }
  .homeBtns { display: flex; flex-direction: column; gap: 14px; width: min(420px, 86vw); }
  .parent { margin-top: 6px; color: var(--muted); font-size: 15px; text-decoration: underline; background: none; }
  /* レベルえらび */
  .grid { flex: 1; overflow-y: auto; padding: 10px 16px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
  .lv { aspect-ratio: 1; border-radius: 18px; background: #fff; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }
  .lv small { font-size: 26px; line-height: 1.1; }
  .lv.done { background: #ecfdf5; border-color: #6ee7b7; }
  .lv.next { border-color: var(--orange); box-shadow: 0 0 0 4px #fed7aa; }
  .lv.lock { opacity: .35; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: var(--muted); margin-top: 8px; }
  .sec svg { width: 44px; height: 44px; }
  /* あそぶ */
  #play .bar { padding-bottom: 4px; }
  #lvTitle { font-size: 22px; }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #cv { touch-action: none; background: transparent; }
  .zoom { position: absolute; top: 6px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .zoom button { width: 58px; height: 58px; border-radius: 16px; background: rgba(255,255,255,.92); border: 2px solid var(--line); font-size: 28px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .zoom button.sm { font-size: 13px; line-height: 1.15; }
  .tools { display: flex; justify-content: center; gap: 12px; padding: 8px 12px 14px; flex-wrap: wrap; }
  .tool { min-width: 150px; padding: 14px 18px; border-radius: 20px; background: #fff; border: 3px solid var(--line); font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .tool.on { border-color: var(--orange); background: #fff7ed; }
  .tool.small { min-width: 0; }
  .prog { display: flex; align-items: center; gap: 10px; padding: 0 18px; font-size: 16px; color: var(--muted); font-weight: 700; }
  .prog .track { flex: 1; height: 12px; border-radius: 6px; background: #e5e7eb; overflow: hidden; }
  .prog .fill { height: 100%; width: 0; background: #9ca3af; transition: width .2s; }
  /* ごほうび */
  .modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  .modal.on { display: flex; }
  .card { background: #fff; border-radius: 28px; padding: 24px 24px 22px; text-align: center; width: min(520px, 94vw); max-height: 94vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  .card h3 { margin: 4px 0 8px; font-size: 30px; }
  .card p { margin: 6px 0 14px; font-size: 20px; color: #374151; line-height: 1.6; }
  .card .robo { width: 240px; height: 240px; }
  .card .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .glow { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { filter: drop-shadow(0 0 2px #fbbf24); } to { filter: drop-shadow(0 0 12px #f59e0b); } }
  /* ずかん */
  .robos { flex: 1; overflow-y: auto; padding: 10px 16px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; align-content: start; }
  .rcard { background: #fff; border-radius: 22px; border: 2px solid var(--line); padding: 10px; text-align: center; }
  .rcard svg { width: 100%; height: auto; max-width: 200px; }
  .rcard b { display: block; font-size: 18px; }
  .rcard span { color: var(--muted); font-size: 15px; }
  .note { text-align: left; font-size: 17px !important; }
  .confetti { position: fixed; top: -20px; font-size: 30px; pointer-events: none; z-index: 20; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>

<!-- ホーム -->
<section class="screen on" id="home">
  <svg id="homeRobot" viewBox="0 0 200 200"></svg>
  <h1>めいろ<span>ロボ</span></h1>
  <p class="sub">いきどまりを ぬりつぶして、ゴールへの みちを みつけよう！</p>
  <div class="homeBtns">
    <button class="big b-orange" id="goNext">▶ つづきから</button>
    <button class="big b-white" id="goLevels">🗺️ レベルを えらぶ</button>
    <button class="big b-white" id="goRobots">🤖 ロボット ずかん</button>
  </div>
  <button class="parent" id="goParent">おうちのかたへ</button>
</section>

<!-- レベルえらび -->
<section class="screen" id="levels">
  <div class="bar"><button class="icon" data-home>🏠</button><h2>レベルを えらぶ</h2><div style="width:54px"></div></div>
  <div class="grid" id="lvGrid"></div>
</section>

<!-- あそぶ -->
<section class="screen" id="play">
  <div class="bar">
    <button class="icon" id="backLevels">◀</button>
    <h2 id="lvTitle">レベル 1</h2>
    <button class="icon" id="howBtn">？</button>
  </div>
  <div class="prog"><span id="progTxt">いきどまり 0 / 0</span><div class="track"><div class="fill" id="progFill"></div></div></div>
  <div id="stage"><canvas id="cv"></canvas><div class="zoom"><button id="zIn" aria-label="おおきく">＋</button><button id="zOut" aria-label="ちいさく">−</button><button id="zReset" class="sm" aria-label="もとの おおきさ" style="font-size:16px">もと</button></div></div>
  <div class="tools">
    <button class="tool on" id="tFill">✏️ ぬりつぶす</button>
    <button class="tool" id="tPath">🖍️ ゴールまで なぞる</button>
    <button class="tool small" id="tUndo">↩️ もどす</button>
    <button class="tool small" id="tClear">🧽 ぜんぶ けす</button>
  </div>
</section>

<!-- ずかん -->
<section class="screen" id="robots">
  <div class="bar"><button class="icon" data-home>🏠</button><h2>ロボット ずかん</h2><div style="width:54px"></div></div>
  <div class="robos" id="robos"></div>
</section>

<!-- ごほうび・あそびかた・おうちのかたへ -->
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

    var title = done ? ROBOTS[ri % ROBOTS.length].name + ' かんせい！' : 'クリア！';
    var msg = first ? (done ? 'ロボットが 1たい できあがったよ！<br>すごい！' : 'ロボットの <b>' + PARTS[pi] + '</b> を ゲット！<br>あと ' + (10 - have) + 'こで かんせい！') : 'もういちど クリア！';
    modal('<h3 class="pop">' + title + '</h3><svg class="robo pop" viewBox="0 0 200 200">' + robotSVG(ri, have, first ? pi : -1) + '</svg><p>' + msg + '</p><div class="btns">' +
      '<button class="big b-white" id="mList">レベル いちらん</button>' + (L < LEVELS ? '<button class="big b-orange" id="mNext">つぎの もんだい ▶</button>' : '<button class="big b-orange" id="mList2">おしまい！</button>') + '</div>');
    $('mList').onclick = function () { closeModal(); show('levels'); };
    if ($('mNext')) $('mNext').onclick = function () { closeModal(); startLevel(L + 1); };
    if ($('mList2')) $('mList2').onclick = function () { closeModal(); show('robots'); };
  }, 900);
}
function confetti(k) { var em = ['🎉', '⭐', '✨', '🔩', '⚙️', '🤖']; for (var i = 0; i < k; i++) { var d = document.createElement('div'); d.className = 'confetti'; d.textContent = em[i % em.length]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = (Math.random() * 0.5) + 's'; document.body.appendChild(d); setTimeout(function (x) { x.remove(); }.bind(null, d), 4000); } }

window.MEIRO = { makeMaze: makeMaze, LEVELS: LEVELS, levelInfo: levelInfo }; // 確認用
renderHome();
</script>
